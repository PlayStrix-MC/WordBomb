name: WordBomb
version: '${version}'
main: padej.wordbomb.bukkit.WordBombPlugin
api-version: '1.21'
load: STARTUP
author: Padej_
description: 'Bomb Party на русских словах: публичный экран DisplayLib, словарь в SQLite'

depend: [DisplayLib]
softdepend: [PlaceholderAPI]

commands:
  wb:
    description: 'WordBomb command'
    usage: '/wb <join|leave|start|offer|report|offer-list|report-list|top|accept|block|add|remove|search|config|mod|reload>'
    aliases: [wordbomb]

permissions:
  wordbomb.eventer:
    description: 'Everything behind the game: /wb join|leave|start, dictionary moderation (/wb mod), arena config, reload'
    default: op
